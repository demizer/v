<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Coverage: @rel_path</title>
<link rel="icon" type="image/x-icon" href="@favicon_path">
<link rel="stylesheet" href="@root_path/common.css">
<script src="@root_path/common.js"></script>
<style>
/* File page specific styles */
h1 { font-size: 20px; }
.file-summary { margin-bottom: 20px; font-size: 18px; }
.file-summary .detail { color: var(--text-muted); font-size: 14px; margin-left: 10px; }
.source { font-family: "SF Mono", Consolas, monospace; font-size: 13px; line-height: 1.5; border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden; }
.line { display: flex; border-bottom: 1px solid var(--line-border); }
.line:last-child { border-bottom: none; }
.line-num { width: 50px; padding: 2px 8px; text-align: right; color: var(--gutter-text); background: var(--gutter-bg); user-select: none; flex-shrink: 0; }
.hits { width: 50px; padding: 2px 8px; text-align: right; color: var(--gutter-text); background: var(--gutter-bg); user-select: none; flex-shrink: 0; font-size: 11px; @hits_display }
.code { flex: 1; padding: 2px 12px; margin: 0; white-space: pre; overflow-x: auto; }
.covered { background: var(--covered-bg); }
.covered .code { background: var(--covered-bg); }
.uncovered { background: var(--uncovered-bg); }
.uncovered .code { background: var(--uncovered-bg); }
.no-cov .code { background: var(--container-bg); }
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1><a href="@back_path">Coverage</a> / @rel_path</h1>
<button class="theme-toggle" onclick="toggleDark()" title="Toggle dark mode">
<svg class="sun-icon" viewBox="0 0 24 24"><path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 10.5v2h3v-2h-3zm-8-5c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm-1 16.95h2V19.5h-2v2.95zm-7.45-3.91l1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"/></svg>
<svg class="moon-icon" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
</button>
</div>
<div class="file-summary">
<span class="@pct_class">@pct%</span>
<span class="detail">(@covered / @total lines)</span>
</div>
<div class="source">
@source_lines
</div>
</div>
</body>
</html>
